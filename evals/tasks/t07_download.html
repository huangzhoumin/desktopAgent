<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DesktopAgent T07 Download</title>
  <style>
    body { font-family: Segoe UI, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>T07 Local Download</h1>
  <p>Click the button to download a small text file (no network).</p>
  <button id="download-btn" type="button">Download marker.txt</button>
  <script>
    const MARKER = "DesktopAgent-T07-你好-Hello-12345";
    document.getElementById("download-btn").addEventListener("click", () => {
      const blob = new Blob([MARKER + "\n"], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "desktop-agent-t07.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
